apiVersion: v1
kind: Namespace
metadata:
  name: kured
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kubereboot
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubereboot.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: kured
spec:
  interval: 1h
  chart:
    spec:
      chart: kured
      version: "6.1.0"
      sourceRef:
        kind: HelmRepository
        name: kubereboot
        namespace: flux-system
  values:
    configuration:
      timeZone: "America/Denver"
      startTime: "03:00"
      endTime: "05:00"
      period: "15m"
