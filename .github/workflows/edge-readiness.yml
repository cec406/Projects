name: Edge readiness checks

on:
  push:
    paths: ['edge-readiness/**', '.github/workflows/edge-readiness.yml']
  pull_request:
    paths: ['edge-readiness/**', '.github/workflows/edge-readiness.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-readiness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest -v
